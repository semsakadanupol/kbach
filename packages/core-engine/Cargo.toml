[package]
name = "kbach-core-engine"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Android-only — never compiled in for the WASM build. jni's JNIEnv/JString
# types don't need to exist (or even resolve) on wasm32-unknown-unknown.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
