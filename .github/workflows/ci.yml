name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, llvm-tools-preview

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core-engine

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install npm dependencies
        run: npm ci

      # packages/react and packages/react-native both depend on
      # packages/core-engine's compiled dist/dist-node output (typechecking
      # against its .d.ts, and react-native's generated wasm/palette files
      # are produced from it too) — turbo's own `^build` dependency in
      # turbo.json only orders tasks WITHIN a single `turbo run`, so lint
      # and test still need core-engine already built first, same as a
      # local `npm run build` in core-engine before working on a downstream
      # package.
      - name: Lint, test, and build every workspace (Rust core-engine first)
        run: npx turbo run lint test build

      # Catches core-engine changes that were built but not propagated to
      # the generated files packages/react-native commits (palette, wasm
      # base64, wasm glue) — these are committed, hand-triggered artifacts
      # with no other freshness check (see verify-generated.mjs's own doc
      # comment). Must run after the build step above, since it reads
      # core-engine's freshly built dist-node/ output.
      - name: Verify generated files are up to date
        run: npm run verify:generated

      # Coverage-instrumented builds (Rust `-C instrument-coverage`, V8
      # coverage for the TS packages) run as their own step, separately
      # from the plain `test` above — informational only (report upload,
      # not a pass/fail gate), so a coverage regression never blocks a PR
      # on its own. `npm run test:coverage` also works locally on macOS/
      # Linux; on Windows, `@kbach/core-engine`'s share of it needs either
      # the MSVC Rust toolchain (with a working `link.exe`, i.e. real MSVC
      # Build Tools installed) or accept that it only runs here in CI —
      # the windows-gnu host Rust ships via `rustup` by default has no
      # `profiler_builtins` crate, which `cargo llvm-cov` requires.
      - name: Generate coverage reports (core-engine, react, react-native)
        run: npx turbo run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/*/coverage
          retention-days: 14

      # apps/native-sandbox and apps/expo-sandbox are excluded from npm
      # workspaces (see their own metro.config.js doc comments — hoisting
      # breaks RN/Gradle tooling) and need an Android/Java toolchain this
      # job doesn't set up, so they're intentionally not covered here.
